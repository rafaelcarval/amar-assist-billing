services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amar_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amar_network

  nginx:
    image: nginx:1.27-alpine
    container_name: amar_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - amar_network

  mysql:
    image: mysql:8.0
    container_name: amar_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: amar_billing
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: amar
      MYSQL_PASSWORD: amar
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - amar_network

  redis:
    image: redis:7-alpine
    container_name: amar_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - amar_network

volumes:
  mysql_data:
  redis_data:

networks:
  amar_network:
    driver: bridge