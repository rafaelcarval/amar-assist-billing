openapi: 3.0.3
info:
  title: 'Amar Assist Billing API'
  description: 'API do sistema de cobranças desenvolvido para o desafio técnico Amar Assist.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8080'
tags:
  -
    name: Clientes
    description: ''
  -
    name: Cobranças
    description: ''
  -
    name: Contratos
    description: ''
  -
    name: Endpoints
    description: ''
paths:
  /api/customers:
    get:
      summary: 'Listar clientes'
      operationId: listarClientes
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Clientes
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 150 characters.'
                  example: vmqeopfuudtdsufvyvddq
                  nullable: true
                document:
                  type: string
                  description: 'Must not be greater than 14 characters.'
                  example: amniihfqcoyn
                  nullable: true
                status:
                  type: string
                  description: ''
                  example: INACTIVE
                  enum:
                    - ACTIVE
                    - INACTIVE
                  nullable: true
                per_page:
                  type: integer
                  description: 'Must be at least 1. Must not be greater than 100.'
                  example: 1
                  nullable: true
    post:
      summary: 'Criar cliente'
      operationId: criarCliente
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Clientes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 150 characters.'
                  example: vmqeopfuudtdsufvyvddq
                document:
                  type: string
                  description: ''
                  example: consequatur
                address:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: mqeopfuudtdsufvyvddqa
                contact:
                  type: string
                  description: 'Must not be greater than 150 characters.'
                  example: mniihfqcoynlazghdtqtq
                status:
                  type: string
                  description: ''
                  example: INACTIVE
                  enum:
                    - ACTIVE
                    - INACTIVE
              required:
                - name
                - document
                - address
                - contact
  '/api/customers/{customer_id}':
    get:
      summary: 'Exibir cliente'
      operationId: exibirCliente
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Clientes
    put:
      summary: 'Atualizar cliente'
      operationId: atualizarCliente
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Clientes
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 150 characters.'
                  example: vmqeopfuudtdsufvyvddq
                document:
                  type: string
                  description: ''
                  example: consequatur
                address:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: mqeopfuudtdsufvyvddqa
                contact:
                  type: string
                  description: 'Must not be greater than 150 characters.'
                  example: mniihfqcoynlazghdtqtq
                status:
                  type: string
                  description: ''
                  example: INACTIVE
                  enum:
                    - ACTIVE
                    - INACTIVE
    parameters:
      -
        in: path
        name: customer_id
        description: 'The ID of the customer.'
        example: 2
        required: true
        schema:
          type: integer
  '/api/customers/{customer_id}/status':
    patch:
      summary: 'Alterar situação do cliente'
      operationId: alterarSituaoDoCliente
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Clientes
    parameters:
      -
        in: path
        name: customer_id
        description: 'The ID of the customer.'
        example: 2
        required: true
        schema:
          type: integer
  /api/charges:
    get:
      summary: 'Listar cobranças'
      operationId: listarCobranas
      description: 'Cobranças abertas e atrasadas são exibidas primeiro.'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Cobranças
  '/api/contracts/{contract_id}/charges':
    post:
      summary: 'Gerar cobrança'
      operationId: gerarCobrana
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Cobranças
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                base_amount:
                  type: string
                  description: 'Must match the regex /^\d+(\.\d{1,2})?$/.'
                  example: '2.77'
                payment_method:
                  type: string
                  description: ''
                  example: CARD
                  enum:
                    - BOLETO
                    - CARD
                    - PIX
                reference_date:
                  type: string
                  description: 'Must be a valid date in the format <code>Y-m-d</code>.'
                  example: '2026-08-24'
                  nullable: true
                barcode:
                  type: string
                  description: 'This field is required when <code>payment_method</code> is <code>BOLETO</code>. Must not be greater than 100 characters.'
                  example: tdsufvyvddqamniihfqco
                  nullable: true
                pix_key:
                  type: string
                  description: 'This field is required when <code>payment_method</code> is <code>PIX</code>. Must not be greater than 255 characters.'
                  example: ynlazghdtqtqxbajwbpil
                  nullable: true
                card_token:
                  type: string
                  description: 'This field is required when <code>payment_method</code> is <code>CARD</code>. Must not be greater than 255 characters.'
                  example: pmufinllwloauydlsmsju
                  nullable: true
                card_brand:
                  type: string
                  description: 'This field is required when <code>payment_method</code> is <code>CARD</code>. Must not be greater than 30 characters.'
                  example: ryvojcybzvrbyickznkyg
                  nullable: true
                card_last_four:
                  type: string
                  description: 'This field is required when <code>payment_method</code> is <code>CARD</code>. Must be 4 digits.'
                  example: '8107'
                  nullable: true
                card_exp_month:
                  type: integer
                  description: 'This field is required when <code>payment_method</code> is <code>CARD</code>. Must be between 1 and 12.'
                  example: 1
                  nullable: true
                card_exp_year:
                  type: integer
                  description: 'This field is required when <code>payment_method</code> is <code>CARD</code>. Must be at least 2026.'
                  example: 1295
                  nullable: true
              required:
                - base_amount
                - payment_method
    parameters:
      -
        in: path
        name: contract_id
        description: 'The ID of the contract.'
        example: 2
        required: true
        schema:
          type: integer
  '/api/charges/{charge_id}/pay':
    patch:
      summary: 'Marcar cobrança como paga'
      operationId: marcarCobranaComoPaga
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Cobranças
    parameters:
      -
        in: path
        name: charge_id
        description: 'The ID of the charge.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/customers/{customer_id}/contracts':
    get:
      summary: 'Listar contratos de um cliente'
      operationId: listarContratosDeUmCliente
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Contratos
    post:
      summary: 'Criar contrato'
      operationId: criarContrato
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Contratos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: ''
                  example: PJ
                  enum:
                    - PF
                    - PJ
                billing_cycle_day:
                  type: integer
                  description: 'Must be between 1 and 31.'
                  example: 1
                active:
                  type: boolean
                  description: ''
                  example: true
              required:
                - type
                - billing_cycle_day
    parameters:
      -
        in: path
        name: customer_id
        description: 'The ID of the customer.'
        example: 2
        required: true
        schema:
          type: integer
  /api/user:
    get:
      summary: ''
      operationId: getApiUser
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
